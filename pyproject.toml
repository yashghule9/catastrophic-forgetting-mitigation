[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cfm"
version = "0.1.0"
description = "Gradient-free unsupervised domain adaptation and catastrophic forgetting mitigation for Vision Transformers via weighted prototype updates and mean shift clustering."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yash Ghule" }]
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "pillow>=10.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "scikit-learn>=1.4",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cfm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
